kind = "web"
previewPath = "/"
title = "happysm"
description = "A private health and lifestyle companion that helps users review their self-reported information, understand basic lifestyle insights, and create practical routines. Health content is educational, not diagnostic."
version = "1.0.0"
id = "artifacts/happysm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21495

[services.development]
run = "pnpm --filter @workspace/happysm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/happysm", "run", "build" ]
serve = "static"
publicDir = "artifacts/happysm/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21495"
BASE_PATH = "/"
